openapi: 3.1.0

info:
  title: Medicare API
  version: 0.1.0
  summary: HTTP API for the Medicare application.
  description: |
    All endpoints are served under the `/api` prefix and speak JSON.

    Requests must send `Accept: application/json`; without it Laravel falls back
    to HTML error pages instead of the JSON error bodies documented here.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: http://localhost/api
    description: Docker (Sail)
  - url: http://localhost:8000/api
    description: Native PHP (php artisan serve)

tags:
  - name: Patients
    description: Patient records.
  - name: Doctors
    description: Doctor records.
  - name: Availabilities
    description: Doctor availabilities.
  - name: Appointments
    description: Patient appointments.
  - name: Free slots
    description: The bookable slots a doctor still has open.

security: []

paths:
  /patients:
    $ref: './paths/patients/index.yaml'
  /patients/{patient}:
    $ref: './paths/patients/patient.yaml'
  /doctors:
    $ref: './paths/doctors/index.yaml'
  /doctors/{doctor}:
    $ref: './paths/doctors/doctor.yaml'
  /doctors/{doctor}/availabilities:
    $ref: './paths/availabilities/index.yaml'
  /doctors/{doctor}/availabilities/{availability}:
    $ref: './paths/availabilities/availability.yaml'
  /patients/{patient}/appointments:
    $ref: './paths/appointments/index.yaml'
  /patients/{patient}/appointments/{appointment}:
    $ref: './paths/appointments/appointment.yaml'
  /patients/{patient}/appointments/{appointment}/confirm:
    $ref: './paths/appointments/confirm.yaml'
  /patients/{patient}/appointments/{appointment}/complete:
    $ref: './paths/appointments/complete.yaml'
  /patients/{patient}/appointments/{appointment}/cancel:
    $ref: './paths/appointments/cancel.yaml'
  /doctors/{doctor}/free-slots:
    $ref: './paths/free-slots/index.yaml'


