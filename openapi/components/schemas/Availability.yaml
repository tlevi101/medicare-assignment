title: Availability
type: object
description: |
  A doctor availability window, returned in a JSON:API format.

  `relationships` is only present when the related resource is requested with
  the `include` query parameter; the related resource itself is then returned
  in the top-level `included` array.
required:
  - id
  - type
  - attributes
properties:
  id:
    type: string
    description: The availability's ID
    examples:
      - '1'
  type:
    type: string
    enum:
      - availabilities
  attributes:
    type: object
    required:
      - starts_at
      - ends_at
      - slot
    properties:
      starts_at:
        type: string
        format: date-time
        description: The start time of the availability window in ISO 8601 format
        examples:
          - 2026-06-01T09:00:00.000000Z
      ends_at:
        type: string
        format: date-time
        description: The end time of the availability window in ISO 8601 format
        examples:
          - 2026-06-01T17:00:00.000000Z
      slot:
        type: integer
        minimum: 30
        description: |
          The duration of a single appointment slot in minutes. Min is 30.
          The period (ends_at - starts_at) must be divisible by slot.
        examples:
          - 30
  relationships:
    type: object
    description: Only present when requested through the `include` query parameter.
    properties:
      doctor:
        type: object
        required:
          - data
        properties:
          data:
            $ref: './ResourceIdentifier.yaml'
