title: AppointmentCollectionResource
type: object
description: A paginated collection of appointments, returned in a JSON:API format
required:
  - data
  - links
  - meta
properties:
  data:
    type: array
    items:
      $ref: './Appointment.yaml'
  links:
    $ref: './PaginationLinks.yaml'
  meta:
    $ref: './PaginationMeta.yaml'
  included:
    type: array
    description: |
      The related resources named in the `include` query parameter, deduplicated
      across the page. Omitted when nothing was included.
    items:
      oneOf:
        - $ref: './Patient.yaml'
        - $ref: './Doctor.yaml'
