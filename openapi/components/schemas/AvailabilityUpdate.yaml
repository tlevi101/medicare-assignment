title: AvailabilityUpdate
type: object
description: |
  Request body accepted by availabilities#update. All fields are optional, but
  the cross-field rules still run over the submitted values, so `starts_at`,
  `ends_at` and `slot` are in practice sent together.

  Beyond the per-field rules, the window must not overlap another availability
  of the same doctor, and the period must be divisible by the slot.
properties:
  starts_at:
    type: string
    format: date-time
    description: |
      The start time of the availability window in ISO 8601 format.
      Must be in the future and before `ends_at`.
    examples:
      - 2026-06-01T09:00:00Z
  ends_at:
    type: string
    format: date-time
    description: |
      The end time of the availability window in ISO 8601 format.
      Must be after `starts_at`.
    examples:
      - 2026-06-01T18:00:00Z
  slot:
    type: integer
    minimum: 30
    description: |
      The duration of a single appointment slot in minutes. Min is 30.
      The period (ends_at - starts_at) must be divisible by slot.
    examples:
      - 60
