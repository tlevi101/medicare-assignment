Page:
  name: page
  in: query
  required: false
  schema:
    type: integer
    minimum: 1
    default: 1

PerPage:
  name: perPage
  in: query
  required: false
  schema:
    type: integer
    minimum: 1
    default: 25

PatientId:
  name: patient
  in: path
  required: true
  description: ID of the patient.
  schema:
    type: integer
    format: int64
    minimum: 1

DoctorId:
  name: doctor
  in: path
  required: true
  description: ID of the doctor.
  schema:
    type: integer
    format: int64
    minimum: 1

AvailabilityId:
  name: availability
  in: path
  required: true
  description: ID of the availability.
  schema:
    type: integer
    format: int64
    minimum: 1

AppointmentId:
  name: appointment
  in: path
  required: true
  description: ID of the appointment.
  schema:
    type: integer
    format: int64
    minimum: 1

Include:
  name: include
  in: query
  required: false
  description: |
    Comma separated list of relationships to side-load. The named relationships
    appear under `data.relationships` and the related resources under the
    top-level `included` array.
  schema:
    type: string
    enum:
      - doctor
  examples:
    doctor:
      value: doctor
    nested:
      value: doctor,doctor.nestedRelation

From:
  name: from
  in: query
  required: false
  description: |
    Start of the queried period. Defaults to the current time
  schema:
    type: string
    format: date-time
  examples:
    tomorrow:
      value: 2026-06-01T09:00:00Z

To:
  name: to
  in: query
  required: false
  description: |
    End of the queried period. Must be after `from`, and at most 14 days later
  schema:
    type: string
    format: date-time
  examples:
    aWeekLater:
      value: 2026-06-08T09:00:00Z

StatusFilter:
  name: filter[status]
  in: query
  required: false
  description: |
    Returns only the appointments in the given status. `filter` is the parameter
    name reserved by JSON:API; its contents are application specific, so the
    supported keys are documented here rather than by the convention.
  schema:
    $ref: '../schemas/AppointmentStatus.yaml'
  examples:
    pending:
      value: pending

AppointmentInclude:
  name: include
  in: query
  required: false
  description: |
    Comma separated list of relationships to side-load. The named relationships
    appear under `data.relationships` and the related resources under the
    top-level `included` array. Accepts `patient` and `doctor`.
  schema:
    type: string
  examples:
    doctor:
      value: doctor
    both:
      value: doctor,patient
